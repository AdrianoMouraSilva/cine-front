<!doctype html>
<html lang="pt-br" data-bs-theme="dark" id="html-root">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cine Front — Catálogo SPA</title>

    <!-- CSS do Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


</head>

<body class="min-vh-100 d-flex flex-column">

    <!-- CABEÇALHO FIXO -->
    <header class="sticky-top">
        <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom shadow-sm">
            <div class="container-lg">

                <!-- Logomarca -->
                <a class="navbar-brand d-flex align-items-center me-3" href="/" data-link>
                    <img src="images/logo/logo_principal.png" width="160" alt="Logo Cine Front">
                </a>

                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false"
                    aria-label="Alternar navegação">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Menu de Navegação gerado dinamicamente via JSON -->
                <div class="collapse navbar-collapse" id="navbarContent">
                    <ul id="navbar-menu" class="navbar-nav me-auto mb-2 mb-lg-0 fw-medium">
                        <!-- Os itens do menu entram aqui via JavaScript -->
                    </ul>

                    <div class="d-flex align-items-center gap-2">
                        <!-- Botão Trocar Tema -->
                        <button id="btn-theme-toggle"
                            class="btn btn-sm btn-outline-warning d-flex align-items-center gap-1" type="button"
                            title="Alternar Tema">
                            <i id="theme-icon" class="bi bi-sun-fill"></i>
                            <span id="theme-text" class="d-none d-xl-inline">Claro</span>
                        </button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- CONTEÚDO PRINCIPAL DINÂMICO -->
    <main id="app" class="container-lg my-4 flex-grow-1">
        <!-- O conteúdo muda aqui -->
    </main>

    <!-- RODAPÉ FIXO -->
    <footer class="bg-body-tertiary border-top py-4 mt-auto">
        <div class="container-lg">
            <div class="row gy-3 align-items-center">
                <div class="col-md-6 ">

                </div>

                <div class="col-md-6 text-md-start">
    <h4>Newsletter</h4>
    <h5>Receba novidades CineFront</h5>
    
    <!-- Alerta de Sucesso (garanta que este ID existe no seu HTML acima do formulário) -->
    <div id="alerta-sucesso" class="alert alert-success d-none mb-3" role="alert">
        Obrigado por se inscrever na nossa newsletter!
    </div>

    <form id="form-newsletter" method="POST">
        <div class="mb-3">
            <label for="email-newsletter" class="form-label fw-semibold">E-mail</label>
            <input type="email" name="email" class="form-control" id="email-newsletter" placeholder="Digite seu e-mail" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="btn-enviar-newsletter">
            <i class="bi bi-envelope me-1"></i>Assinar
        </button>
    </form>
</div>

<script type="module">
    import { API_FORM_E_MAIL_NEWSLETTER } from '../config.js';

    const formNewsletter = document.getElementById('form-newsletter');
    const botaoEnviarNewsletter = document.getElementById('btn-enviar-newsletter');
    const alertaSucesso = document.getElementById('alerta-sucesso');

    // Define o action do formulário dinamicamente
    if (formNewsletter) {
        formNewsletter.action = API_FORM_E_MAIL_NEWSLETTER;

        formNewsletter.addEventListener('submit', async function (event) {
            event.preventDefault();

            // Esconde o alerta anterior se estiver visível
            if (alertaSucesso) {
                alertaSucesso.classList.add('d-none');
            }

            // Desativa o botão e mostra o carregamento
            botaoEnviarNewsletter.disabled = true;
            botaoEnviarNewsletter.innerHTML = `<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Enviando...`;

            try {
                const response = await fetch(formNewsletter.action, {
                    method: 'POST',
                    body: new FormData(formNewsletter),
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    formNewsletter.reset();

                    if (alertaSucesso) {
                        alertaSucesso.classList.remove('d-none');
                        alertaSucesso.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }
                } else {
                    alert('Ocorreu um erro ao enviar. Verifique as configurações de envio.');
                }
            } catch (error) {
                alert('Erro de conexão ao tentar enviar o e-mail.');
            } finally {
                // Restaura o botão ao estado original
                botaoEnviarNewsletter.disabled = false;
                botaoEnviarNewsletter.innerHTML = `<i class="bi bi-envelope me-1"></i>Assinar`;
            }
        });
    }
</script>
            </div>

            <div class="row gy-3 align-items-center pt-5">
                <div class="col-md-6 text-center text-md-start">
                    <p class="mb-0 text-secondary small">&copy; Cine Front. Todos os direitos reservados.</p>
                </div>
                <div class="col-md-6 text-center text-md-end">
                    <a href="#" class="text-secondary me-3 fs-5"><i class="bi bi-instagram"></i></a>
                    <a href="#" class="text-secondary me-3 fs-5"><i class="bi bi-github"></i></a>
                    <a href="#" class="text-secondary fs-5"><i class="bi bi-youtube"></i></a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Script de Rotas -->
    <script src="js/router.js"></script>

    <!-- JS do Bootstrap 5.3.3 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
