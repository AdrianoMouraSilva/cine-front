<style>
    /* Regra CSS mínima necessária para acionar a exibição do balão customizado ao passar o mouse */
    #group-hover:hover #balao-popover {
        display: block !important;
    }
</style>

<script type="module">
    import { initCadastro } from '../js/cadastro.js';
    initCadastro();
</script>


<div class="row justify-content-center py-4">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0 bg-body-tertiary p-4 rounded-4">

            <!-- Alerta bonito e moderno de sucesso (inicialmente oculto) -->
            <div id="alerta-sucesso"
                class="alert alert-success d-flex align-items-center d-none mb-4 rounded-3 shadow-sm" role="alert">
                <i class="bi bi-check-circle-fill flex-shrink-0 me-2 fs-4"></i>
                <div>
                    <strong>Tudo certo!</strong> Seu cadastro foi enviado com sucesso.
                </div>
            </div>

            <!-- O action começa vazio e será preenchido dinamicamente pelo JavaScript -->
            <form id="form-cadastro" method="POST">

                <div class="mb-3">
                    <label for="nome" class="form-label fw-semibold">Nome</label>
                    <input type="text" name="nome" class="form-control" id="nome" placeholder="Digite seu nome"
                        required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">E-mail</label>
                    <input type="email" name="email" class="form-control" id="email" placeholder="Digite seu E-mail"
                        required>
                </div>

                <div class="mb-3">
                    <label for="data-nascimento" class="form-label fw-semibold">
                        Data de Nascimento
                    </label>
                    <input type="date" id="data-nascimento" name="data-nascimento" class="form-control" min="1920-01-01"
                        max="2026-12-31" required>

                    <!-- Mensagem opcional que aparece em verde quando for VÁLIDO -->
                    <div id="msg-sucesso-data" class="valid-feedback">
                        Data de nascimento válida!
                    </div>
                    <!-- Mensagem que aparece em vermelho quando for INVÁLIDO -->
                    <div id="msg-erro-data" class="invalid-feedback">
                        Por favor, informe uma data de nascimento válida.
                    </div>
                </div>


                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Senha</label>
                    <input type="password" name="password" class="form-control" id="password"
                        placeholder="Digite sua senha" required>
                    <div id="msg-sucesso-senha" class="valid-feedback">
                    </div>

                    <div id="msg-erro-senha" class="invalid-feedback">
                    </div>
                </div>

                <div class="mb-3">
                    <div class="progress" role="progressbar" aria-label="Exemplo de progresso" aria-valuenow="0"
                        aria-valuemin="0" aria-valuemax="100">
                        <div id="minha-barra" class="progress-bar" style="width: 0%">0%</div>
                    </div>

                </div>


                <div class="mb-3 position-relative">
                    <label for="confima-password" class="form-label fw-semibold">Confirme a Senha</label>

                    <div class="position-relative d-inline-block w-100 group-hover">

                        <input type="password" name="confima-password" class="form-control pe-none"
                            id="confima-password" placeholder="Confirme sua senha" required disabled>

                        <!-- Balão utilizando classes dinâmicas de tema do Bootstrap -->
                        <!-- <div class="balao-popover position-absolute start-50 translate-middle-x bottom-100 mb-2 p-3 bg-body-tertiary text-body border rounded-3 shadow-lg w-100"
                            style="max-width: 320px; z-index: 1050; display: none;">
                            <div class="d-flex align-items-center mb-1 fw-bold text-warning">
                                <span class="me-2">🔒</span> Requisito de Confirmação
                            </div>
                            <p class="small mb-2 text-body-secondary">
                                Para garantir a segurança, repita a senha acima exatamente como digitou.
                            </p>
                            <ul class="small mb-0 ps-3 text-body-secondary">
                                <li>Deve corresponder à Nova Senha</li>
                                <li>Mínimo de 8 caracteres</li>
                            </ul>
                        </div> -->

                        <div id="msg-sucesso-senha-confirma" class="valid-feedback"></div>
                        <div id="msg-erro-senha-confirma" class="invalid-feedback"></div>
                    </div>
                </div>

                <style>
                    /* .group-hover:hover .balao-popover {
                        display: block !important;
                    } */
                </style>




                <!-- Campo de Seleção de Sexo (name unificado para funcionar como grupo) -->
                <div class="mb-3">
                    <label class="form-label fw-semibold d-block">Sexo</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="sexo" id="masculino" value="Masculino"
                            required>
                        <label class="form-check-label" for="masculino">
                            Masculino
                        </label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="sexo" id="feminino" value="Feminino"
                            required>
                        <label class="form-check-label" for="feminino">
                            Feminino
                        </label>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="origem" class="form-label fw-semibold">Como você nos encontrou?</label>
                    <select class="form-select" id="origem" name="origem" required>
                        <option value="" selected disabled>Selecione uma opção...</option>
                        <option value="Google">Google</option>
                        <option value="Amigo">Indicação de Amigo</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="generos" class="form-label fw-semibold d-block">Gêneros</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="acao" value="Ação" name="generos">
                        <label class="form-check-label" for="acao">Ação</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="aventura" value="Aventura" name="generos">
                        <label class="form-check-label" for="aventura">Aventura</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="animacao" value="Animação" name="generos">
                        <label class="form-check-label" for="animacao">Animação</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="comedia" value="Comédia" name="generos">
                        <label class="form-check-label" for="comedia">Comédia</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="crime" value="Crime" name="generos">
                        <label class="form-check-label" for="crime">Crime</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="documentario" value="Documentário"
                            name="generos">
                        <label class="form-check-label" for="documentario">Documentário</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="drama" value="Drama" name="generos">
                        <label class="form-check-label" for="drama">Drama</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="familia" value="Família" name="generos">
                        <label class="form-check-label" for="familia">Família</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="fantasia" value="Fantasia" name="generos">
                        <label class="form-check-label" for="fantasia">Fantasia</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="historia" value="historia" name="generos">
                        <label class="form-check-label" for="historia">História</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="terror" value="Terror" name="generos">
                        <label class="form-check-label" for="terror">Terror</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="musica" value="Música" name="generos">
                        <label class="form-check-label" for="musica">Música</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="misterio" value="Mistério" name="generos">
                        <label class="form-check-label" for="misterio">Mistério</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="romance" value="Romance" name="generos">
                        <label class="form-check-label" for="romance">Romance</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="ficcao-cientifica" value="Ficção científica"
                            name="generos">
                        <label class="form-check-label" for="ficcao-cientifica">Ficção científica</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="cinema-tv" value="Cinema TV" name="generos">
                        <label class="form-check-label" for="cinema-tv">Cinema TV</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="thriller" value="Thriller" name="generos">
                        <label class="form-check-label" for="thriller">Thriller</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="guerra" value="Guerra" name="generos">
                        <label class="form-check-label" for="guerra">Guerra</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="faroeste" value="Faroeste" name="generos">
                        <label class="form-check-label" for="faroeste">Faroeste</label>
                    </div>

                </div>

                <div class="mb-3">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="aceite-termos"
                            name="aceite_termos" required>
                        <label class="form-check-label" for="aceite-termos">Li e aceito os termos</label>
                    </div>
                </div>
                <div class="mb-3">
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="btn-cadastrar"
                        value="btn-cadastrar">
                        <i class="bi bi-envelope me-1"></i> Cadastrar
                    </button>
                </div>
                <div class="mb-3">
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="btn-limpar"
                        value="btn-limpar">
                        <i class="bi bi-envelope me-1"></i> Limpar
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>
