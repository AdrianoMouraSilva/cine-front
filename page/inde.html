<div class="row justify-content-center py-4">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0 bg-body-tertiary p-4 rounded-4">
            <h2 class="h3 fw-bold mb-3 text-center">
                <i class="bi bi-envelope-paper text-primary me-2"></i>Entre em Contato...!!!
            </h2>
            <p class="text-secondary text-center mb-4">Tem alguma sugestão ou dúvida? Mande uma mensagem para a turma!</p>
            
            <form onsubmit="event.preventDefault(); alert('Mensagem enviada com sucesso!');">
                <div class="mb-3">
                    <label for="nome" class="form-label">Seu Nome</label>
                    <input type="text" class="form-control" id="nome" placeholder="Digite seu nome" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" placeholder="seu@email.com" required>
                </div>
                <div class="mb-3">
                    <label for="mensagem" class="form-label">Mensagem</label>
                    <textarea class="form-control" id="mensagem" rows="4" placeholder="Escreva sua mensagem..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                    <i class="bi bi-send me-1"></i> Enviar Mensagem
                </button>
            </form>
        </div>
    </div>
</div>
