<div class="row justify-content-center py-4">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0 bg-body-tertiary p-4 rounded-4">

            <!-- Alerta bonito e moderno de sucesso (inicialmente oculto) -->
            <div id="alerta-sucesso"
                class="alert alert-success d-flex align-items-center d-none mb-4 rounded-3 shadow-sm" role="alert">
                <i class="bi bi-check-circle-fill flex-shrink-0 me-2 fs-4"></i>
                <div>
                    <strong>Tudo certo!</strong> Sua recomendação foi enviada por e-mail com sucesso.
                </div>
            </div>

            <!-- O action começa vazio e será preenchido dinamicamente pelo JavaScript -->
            <form id="form-cadastro" method="POST">

                <div class="mb-3">
                    <label for="nome" class="form-label fw-semibold">Nome</label>
                    <input type="text" name="nome" class="form-control" id="nome" placeholder="Digite seu nome"
                        required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">E-mail</label>
                    <input type="email" name="email" class="form-control" id="email" placeholder="Digite seu E-mail"
                        required>
                </div>

                <div class="mb-3">
                    <label for="data-nascimento" class="form-label fw-semibold">
                        Data Nascimento
                    </label>
                    <input type="date" id="data-nascimento" name="data-nascimento" class="form-control" min="1920-01-01"
                        max="2026-12-31" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Senha</label>
                    <input type="password" name="password" class="form-control" id="password"
                        placeholder="Digite sua senha" required>
                </div>
                <div class="mb-3">
                    <label for="confima-password" class="form-label fw-semibold">Confirma Senha</label>
                    <input type="password" name="confima-password" class="form-control" id="confima-password"
                        placeholder="confima sua senha" required>
                </div>
                <div class="mb-3">
                    <label for="Sexo" class="form-label fw-semibold">Sexo</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="m" id="masculino">
                        <label class="form-check-label" for="masculino">
                            Masculino
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="f" id="feminino">
                        <label class="form-check-label" for="feminino">
                            Feminino
                        </label>
                    </div>
                </div>

                <div class="mb-3">
                    <select class="form-select form-select-sm" aria-label=".form-select-sm example">
                        <option selected>Como conheceu a nossa plataforma?</option>
                        <option value="Google">Google</option>
                        <option value="Amigo">Amigo</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>


                <div class="mb-3">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="aceite-termos">
                        <label class="form-check-label" for="flexSwitchCheckDefault">Aceite termos</label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="btn-cadastrar">
                    <i class="bi bi-envelope me-1"></i> Cadastrar enviar por e-mail
                </button>
            </form>
        </div>
    </div>
</div>

<script type="module">
    import { API_FORM_CADASTRAR } from '../config.js';

    const formCadastrar = document.getElementById('form-cadastro');
    const botaoCadastrar = document.getElementById('btn-cadastrar');
    const alertaSucesso = document.getElementById('alerta-sucesso');

    // Define o action do formulário dinamicamente usando a constante importada
    formCadastrar.action = API_FORM_CADASTRAR;

    // Associa o evento de envio via JavaScript para interceptar e impedir o redirecionamento
    formCadastrar.addEventListener('submit', async function (event) {
        event.preventDefault(); // Impede o navegador de sair da página atual

        // Esconde o alerta anterior se estiver visível
        alertaSucesso.classList.add('d-none');

        // Desativa o botão e mostra o carregamento
        botaoCadastrar.disabled = true;
        botaoCadastrar.innerHTML = `<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Enviando recomendação...`;

        try {
            const response = await fetch(formCadastrar.action, {
                method: 'POST',
                body: new FormData(formCadastrar),
                headers: {
                    'Accept': 'application/json' // Obriga o Formspree a responder via JSON em vez de redirecionar a página
                }
            });

            if (response.ok) {
                // Limpa os campos do formulário
                formCadastrar.reset();

                // Exibe o alerta bonito de sucesso
                alertaSucesso.classList.remove('d-none');
                alertaSucesso.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } else {
                alert('Ocorreu um erro ao enviar. Verifique se o ID do Formspree está correto.');
            }
        } catch (error) {
            alert('Erro de conexão ao tentar enviar o e-mail.');
        } finally {
            // Restaura o botão ao estado original
            botaoCadastrar.disabled = false;
            botaoCadastrar.innerHTML = `<i class="bi bi-envelope me-1"></i> Enviar recomendação por e-mail`;
        }
    });
</script>
